# Builds the QRLog Android APK in the cloud — no Android Studio, no local SDK.
#
# Why this exists: the native project targets API 36 with AGP 8.13, which makes a local build heavy
# (Android Studio froze on the maintainer's machine). GitHub's Linux runners already ship the JDK and
# Android SDK, so the whole build happens here and the finished APK comes back as a downloadable file.
#
# How to run it:
#   1. Open the repo on GitHub → the "Actions" tab.
#   2. Pick "Build Android APK" in the left list → "Run workflow" (on branch main) → green button.
#   3. Wait ~5-8 min. Open the finished run → "Artifacts" → download "qrlog-debug-apk".
#   4. Unzip → app-debug.apk → copy to the phone → install (allow "unknown sources" once).
#
# The result is a DEBUG apk: perfect for sideloading onto staff phones and testing the native camera
# permission. Google Play needs a *release-signed* build instead — that's a later step (a signing
# keystore added as a repo secret), not this workflow.
name: Build Android APK

on:
  workflow_dispatch: {}   # manual only — an APK is not built on every push

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's capacitor-android library compiles with source/target release 21, so the JDK must
      # be 21+ (JDK 17 fails with "invalid source release: 21"). AGP 8.13 runs fine on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Capacitor CLI (@capacitor/cli 8.x) requires Node >=22 — the web build itself is fine on 20
      # (frontend/Dockerfile), but `cap sync` fatal-errors below 22, so build everything on 22 here.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # compileSdk/targetSdk are 36 (see android/variables.gradle); the runner may not preinstall it.
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # cap sync regenerates the gitignored capacitor.config.json + plugin registration and copies the
      # web build into the native project. server.url means the app loads the live site at runtime, but
      # a dist/ folder must still exist for the sync to succeed.
      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qrlog-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
