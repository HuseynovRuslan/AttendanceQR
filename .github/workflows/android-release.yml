# Builds a SIGNED Google Play release — an .aab (App Bundle, what Play wants) plus a signed .apk you
# can sideload to test the exact release build. Signed with the QRLog upload key, which lives only in
# the repo secrets (ANDROID_KEYSTORE_BASE64 / _PASSWORD / _KEY_PASSWORD / _KEY_ALIAS), never in git.
#
# Run it: Actions tab → "Build Android Release (signed AAB)" → Run workflow → download "qrlog-release".
# Upload app-release.aab to Play Console. First upload enrolls in Play App Signing.
#
# NOTE: every new Play upload needs a higher versionCode. Bump `versionCode` in
# frontend/android/app/build.gradle (1 → 2 → 3 …) before each release after the first.
name: Build Android Release (signed AAB)

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Decode upload keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/frontend/android/upload-keystore.jks"

      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build signed AAB + APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qrlog-release
          path: |
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ github.workspace }}/frontend/android/upload-keystore.jks"
