# Which PWA brand-icon set to serve, by host. The install icon ("Add to Home Screen") and iOS's
# apple-touch-icon are NOT branded by the dynamic manifest — iOS ignores the manifest icons entirely and
# reads the static apple-touch-icon link. So the icon files themselves must vary per host: Bakı Abadlıq
# (the original tenant) keeps its own; every other tenant — a new customer — gets the neutral QRLog mark,
# NOT Bakı Abadlıq's leaf. New tenants are added here only if they want a custom installed icon.
map $host $pwa {
    default     qrlog;
    ~^bax\.     bax;   # bax.qrlog.az (and bax.test.qrlog.az on staging) — the original tenant keeps its leaf
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Per-host PWA icons (see the $pwa map). These three paths are what index.html's apple-touch-icon link
    # and the manifest's PNG icons point at; nginx swaps in the right brand's file by host. no-cache so a
    # browser that grabbed the old shared (Bakı Abadlıq) icon re-fetches on the next install.
    location = /apple-touch-icon.png { try_files /pwa/$pwa/apple-touch-icon.png =404; add_header Cache-Control "no-cache"; }
    location = /icon-192.png         { try_files /pwa/$pwa/icon-192.png =404;         add_header Cache-Control "no-cache"; }
    location = /icon-512.png         { try_files /pwa/$pwa/icon-512.png =404;         add_header Cache-Control "no-cache"; }

    # SPA fallback: React Router owns client-side routes, so any unknown path
    # must return index.html instead of a 404 (e.g. /admin, /activate, /kiosk/:id).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache the entry document, so new deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Per-tenant PWA manifest: proxy to the backend, which resolves the tenant from the Host header and
    # returns a manifest with that tenant's name + logo (so "Add to Home Screen" isn't shared). Served
    # here at <slug>.qrlog.az/manifest.webmanifest → same-origin, no CORS. The backend sets the correct
    # application/manifest+json content-type.
    location = /manifest.webmanifest {
        proxy_pass http://backend:8080/api/tenant/manifest;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # The app polls this to notice a deploy and reload itself (an installed iOS PWA is suspended, not
    # closed, so it never re-fetches index.html on its own). A cached copy would defeat the whole
    # mechanism, so this one is no-store rather than no-cache.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
